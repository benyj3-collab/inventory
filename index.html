<style>
:root {
  --bg: #f5f5f0;
  --surface: #ffffff;
  --fg: #1a1a1a;
  --fg-dim: #6b6b6b;
  --border: #e2e0dc;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --accent-fg: #ffffff;
  --success: #16a34a;
  --success-light: #dcfce7;
  --warn: #d97706;
  --warn-light: #fef3c7;
  --danger: #dc2626;
  --danger-light: #fee2e2;
  --locked-bg: #f0fdf4;
  --locked-border: #bbf7d0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113;
    --surface: #1c1c1f;
    --fg: #e8e8e6;
    --fg-dim: #8a8a8a;
    --border: #2e2e32;
    --accent: #5b8def;
    --accent-light: #1e2a42;
    --accent-fg: #ffffff;
    --success: #22c55e;
    --success-light: #14291d;
    --warn: #f59e0b;
    --warn-light: #2a2010;
    --danger: #ef4444;
    --danger-light: #2a1515;
    --locked-bg: #14291d;
    --locked-border: #1a3d24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113;
  --surface: #1c1c1f;
  --fg: #e8e8e6;
  --fg-dim: #8a8a8a;
  --border: #2e2e32;
  --accent: #5b8def;
  --accent-light: #1e2a42;
  --accent-fg: #ffffff;
  --success: #22c55e;
  --success-light: #14291d;
  --warn: #f59e0b;
  --warn-light: #2a2010;
  --danger: #ef4444;
  --danger-light: #2a1515;
  --locked-bg: #14291d;
  --locked-border: #1a3d24;
  color-scheme: dark;
}

*{box-sizing:border-box;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Rubik','Noto Sans Hebrew',system-ui,sans-serif;
  direction:rtl;
  padding:0 max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px));
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
}

/* LOGIN */
#loginScreen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;gap:20px;padding:20px;
}
#loginScreen h1{font-size:1.5rem;font-weight:700;}
#loginScreen p{color:var(--fg-dim);font-size:0.9rem;text-align:center;}
.login-input{
  width:100%;max-width:300px;
  background:var(--surface);border:2px solid var(--border);border-radius:12px;
  padding:14px 16px;font-size:1.1rem;font-family:inherit;color:var(--fg);
  text-align:center;-webkit-appearance:none;
}
.login-input:focus{outline:none;border-color:var(--accent);}
.login-btn{
  width:100%;max-width:300px;
  background:var(--accent);color:var(--accent-fg);border:none;border-radius:12px;
  padding:14px;font-size:1rem;font-family:inherit;font-weight:600;cursor:pointer;
}
.login-error{color:var(--danger);font-size:0.85rem;display:none;}

/* APP */
#appScreen{display:none;}

/* Header */
.header{
  position:sticky;top:0;background:var(--bg);z-index:5;
  padding:12px 0 8px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.header h1{font-size:1.15rem;font-weight:700;}
.stats{display:flex;gap:6px;align-items:center;}
.stat-badge{
  padding:3px 8px;border-radius:16px;font-size:0.72rem;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.stat-counted{background:var(--success-light);color:var(--success);}
.sync-dot{
  width:7px;height:7px;background:var(--success);border-radius:50%;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Camera */
.camera-section{margin:10px 0;border-radius:12px;overflow:hidden;position:relative;}
#reader{width:100%;border:none !important;}
#reader video{border-radius:12px !important;object-fit:cover;}
#reader img[alt="Info icon"]{display:none !important;}
.camera-controls{
  display:flex;gap:8px;margin:8px 0;
}
.torch-btn{
  position:absolute;top:10px;left:10px;z-index:10;
  background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;
  width:40px;height:40px;font-size:20px;cursor:pointer;
  display:none;align-items:center;justify-content:center;
}
.torch-btn.active{background:rgba(255,200,0,0.8);color:#000;}
.scan-hint{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(0,0,0,0.6);color:#fff;padding:4px 12px;border-radius:12px;
  font-size:12px;pointer-events:none;
}
.cam-btn{
  flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--surface);font-family:inherit;font-size:0.82rem;font-weight:500;
  color:var(--fg);cursor:pointer;text-align:center;
}
.cam-btn.active{border-color:var(--success);color:var(--success);background:var(--success-light);}
.cam-btn.danger{border-color:var(--danger);color:var(--danger);}

/* Input */
.input-section{display:flex;gap:8px;margin-bottom:10px;}
.barcode-input{
  flex:1;background:var(--surface);border:2px solid var(--border);border-radius:12px;
  padding:12px 14px;font-size:1.05rem;font-family:inherit;color:var(--fg);
  direction:ltr;text-align:right;-webkit-appearance:none;
}
.barcode-input:focus{outline:none;border-color:var(--accent);}
.barcode-input::placeholder{color:var(--fg-dim);direction:rtl;font-size:0.85rem;}
.search-btn{
  background:var(--accent);color:var(--accent-fg);border:none;border-radius:12px;
  padding:0 22px;font-size:1rem;font-family:inherit;font-weight:600;
  cursor:pointer;white-space:nowrap;min-width:60px;
}

/* Product card */
.product-card{
  background:var(--surface);border:2px solid var(--accent);border-radius:12px;
  padding:14px;margin-bottom:10px;animation:slideIn .2s ease-out;
}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.product-card h3{font-size:1.05rem;font-weight:600;margin-bottom:6px;}
.product-meta{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  font-size:0.8rem;color:var(--fg-dim);margin-bottom:12px;
}
.product-meta span{font-weight:500;color:var(--fg);}
.cost-row{
  display:flex;align-items:center;gap:8px;
  background:var(--warn-light);padding:8px 10px;border-radius:8px;
  margin-bottom:10px;font-size:0.82rem;
}
.cost-row label{color:var(--warn);font-weight:600;white-space:nowrap;}
.cost-input{
  width:90px;background:var(--surface);border:1.5px solid var(--warn);border-radius:6px;
  padding:6px 8px;font-size:1rem;font-family:inherit;font-weight:600;
  color:var(--fg);text-align:center;direction:ltr;-webkit-appearance:none;
}
.cost-input:focus{outline:none;border-color:var(--accent);}
.cost-zero-alert{color:var(--danger);font-size:0.75rem;font-weight:500;}
.qty-row{display:flex;align-items:center;gap:8px;}
.qty-input{
  width:80px;background:var(--bg);border:2px solid var(--border);border-radius:8px;
  padding:10px;font-size:1.4rem;font-family:inherit;font-weight:700;
  color:var(--fg);text-align:center;-webkit-appearance:none;
}
.qty-input:focus{outline:none;border-color:var(--accent);}
.confirm-btn{
  flex:1;background:var(--success);color:#fff;border:none;border-radius:8px;
  padding:10px;font-size:1rem;font-family:inherit;font-weight:600;cursor:pointer;
}
.cancel-btn{
  background:transparent;color:var(--fg-dim);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;font-size:0.82rem;font-family:inherit;cursor:pointer;
}

/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-top:4px;}
.tab{
  flex:1;text-align:center;padding:9px 0;font-size:0.82rem;font-weight:500;
  color:var(--fg-dim);cursor:pointer;border:none;background:none;
  font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-2px;
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}

/* Counted items */
.counted-list{padding:6px 0 110px;}
.counted-item{
  background:var(--locked-bg);border:1px solid var(--locked-border);
  border-radius:8px;padding:9px 10px;margin-bottom:5px;
  display:flex;align-items:center;gap:8px;
}
.counted-item .lock-icon{font-size:0.65rem;color:var(--success);flex-shrink:0;}
.item-info{flex:1;min-width:0;}
.item-name{font-weight:500;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-barcode{font-size:0.72rem;color:var(--fg-dim);direction:ltr;text-align:right;font-variant-numeric:tabular-nums;}
.item-counts-detail{font-size:0.7rem;color:var(--fg-dim);direction:ltr;text-align:right;}
.item-qty-badge{
  background:var(--success);color:#fff;font-weight:700;font-size:1rem;
  padding:4px 10px;border-radius:8px;font-variant-numeric:tabular-nums;
  min-width:40px;text-align:center;flex-shrink:0;
}
.item-locked-label{font-size:0.65rem;color:var(--success);font-weight:600;text-align:center;}

/* Summary */
.summary-item{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:9px 10px;margin-bottom:5px;display:flex;align-items:center;gap:8px;
}
.summary-breakdown{font-size:0.7rem;color:var(--fg-dim);direction:ltr;text-align:right;}
.summary-total{
  background:var(--accent);color:#fff;font-weight:700;font-size:1rem;
  padding:4px 12px;border-radius:8px;font-variant-numeric:tabular-nums;
  min-width:44px;text-align:center;flex-shrink:0;
}

/* Search */
.search-results{padding:6px 0;}
.search-item{padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.search-item:active{background:var(--accent-light);border-radius:6px;}
.name-search-input{
  width:100%;background:var(--surface);border:2px solid var(--border);border-radius:12px;
  padding:11px 14px;font-size:0.92rem;font-family:inherit;color:var(--fg);
  margin-bottom:6px;-webkit-appearance:none;
}
.name-search-input:focus{outline:none;border-color:var(--accent);}

/* Bottom bar */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  border-top:1px solid var(--border);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  display:flex;gap:8px;z-index:8;
}
.bottom-small-btn{
  background:transparent;color:var(--fg-dim);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;font-size:0.75rem;font-family:inherit;
  font-weight:500;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;
}
.transmit-badge{
  background:var(--accent-light);color:var(--accent);font-size:0.68rem;
  padding:1px 5px;border-radius:6px;font-weight:600;
}

/* Toast */
.toast{
  position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);background:var(--success);color:#fff;
  padding:8px 18px;border-radius:18px;font-size:0.82rem;font-weight:500;
  z-index:20;white-space:nowrap;
  animation:toastIn .3s ease-out,toastOut .3s 1.5s ease-in forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(20px)}}

.empty-state{text-align:center;padding:28px 0;color:var(--fg-dim);}
.empty-state .icon{font-size:2rem;margin-bottom:8px;}
.empty-state p{font-size:0.88rem;line-height:1.5;}

[hidden]{display:none!important}

/* Settings modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:var(--surface);border-radius:16px;padding:20px;
  width:100%;max-width:380px;max-height:80vh;overflow-y:auto;
}
.modal h2{font-size:1.1rem;font-weight:600;margin-bottom:14px;}
.modal label{display:block;font-size:0.85rem;color:var(--fg-dim);margin-bottom:4px;}
.modal input[type="text"],.modal input[type="url"],.modal input[type="password"]{
  width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
  padding:10px;font-size:0.9rem;font-family:inherit;color:var(--fg);
  margin-bottom:12px;direction:ltr;-webkit-appearance:none;
}
.modal input:focus{outline:none;border-color:var(--accent);}
.modal-actions{display:flex;gap:8px;margin-top:8px;}
.modal-actions button{
  flex:1;padding:10px;border-radius:8px;font-family:inherit;font-size:0.9rem;
  font-weight:600;cursor:pointer;
}
.modal-save{background:var(--accent);color:#fff;border:none;}
.modal-cancel{background:transparent;color:var(--fg-dim);border:1px solid var(--border);}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <h1>📋 ספירת מלאי</h1>
  <p>הזן סיסמה כדי להיכנס</p>
  <input type="password" class="login-input" id="passInput" placeholder="סיסמה" autocomplete="off">
  <p class="login-error" id="loginError">סיסמה שגויה</p>
  <button class="login-btn" id="loginBtn">כניסה</button>
</div>

<!-- APP SCREEN -->
<div id="appScreen">

<div class="header">
  <h1>📋 ספירת מלאי</h1>
  <div class="stats">
    <span class="stat-badge stat-counted" id="countBadge">0</span>
    <span class="sync-dot" id="syncDot" title="מחובר"></span>
  </div>
</div>

<!-- CAMERA -->
<div class="camera-section">
  <button class="torch-btn" id="torchBtn" onclick="toggleTorch()">🔦</button>
  <div id="reader"></div>
  <div class="scan-hint" id="scanHint">כוון את הברקוד למרכז המסך</div>
</div>
<div class="camera-controls">
  <button class="cam-btn active" id="camStartBtn" onclick="startCamera()">📷 הפעל מצלמה</button>
  <button class="cam-btn danger" id="camStopBtn" onclick="stopCamera()" style="display:none">⏹ כבה מצלמה</button>
</div>

<!-- INPUT -->
<div class="input-section">
  <input type="text" inputmode="numeric" class="barcode-input" id="barcodeInput" placeholder="ברקוד מלא או ספרות אחרונות..." autocomplete="off">
  <button class="search-btn" id="searchBtn">חפש</button>
</div>

<!-- PRODUCT CARD -->
<div id="productCard" hidden></div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" data-tab="counted">📝 נספרו</button>
  <button class="tab" data-tab="summary">📊 סיכום</button>
  <button class="tab" data-tab="search">🔍 חיפוש</button>
</div>

<div id="countedTab"><div class="counted-list" id="countedList">
  <div class="empty-state"><div class="icon">📦</div><p>עדיין לא נספרו מוצרים<br>סרקו ברקוד כדי להתחיל</p></div>
</div></div>

<div id="summaryTab" hidden><div class="counted-list" id="summaryList">
  <div class="empty-state"><div class="icon">📊</div><p>הסיכום יופיע כאן</p></div>
</div></div>

<div id="searchTab" hidden><div style="padding:10px 0;">
  <input type="text" class="name-search-input" id="nameSearch" placeholder="חפש לפי שם מוצר...">
  <div class="search-results" id="searchResults"></div>
</div></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar" id="bottomBar">
  <button class="bottom-small-btn" id="exportBtn">📥 ייצוא</button>
  <button class="bottom-small-btn" id="transmitBtn">📡 שדר <span class="transmit-badge" id="pendingBadge">0</span></button>
  <button class="bottom-small-btn" id="settingsBtn">⚙️</button>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="settingsModal" hidden>
  <div class="modal">
    <h2>⚙️ הגדרות</h2>
    <label>שם מכשיר:</label>
    <input type="text" id="deviceNameInput" placeholder="מכשיר 1">
    <label>כתובת Google Apps Script:</label>
    <input type="url" id="gasUrlInput" placeholder="https://script.google.com/macros/s/...">
    <label>העלאה אוטומטית כל X פריטים:</label>
    <input type="text" id="autoSyncInput" placeholder="20" inputmode="numeric">
    <div class="modal-actions">
      <button class="modal-save" onclick="saveSettings()">שמור</button>
      <button class="modal-cancel" onclick="closeSettings()">סגור</button>
    </div>
  </div>
</div>

// ===== PRODUCT INDEX =====
const productMap = {};
const suffixMaps = {};
let maxBarcodeLen = 0;

P.forEach(p => {
  productMap[p.b] = p;
  if(p.b.length > maxBarcodeLen) maxBarcodeLen = p.b.length;
});

// Build suffix maps for 4..maxLen
for(let len=4; len<=maxBarcodeLen; len++){
  suffixMaps[len] = {};
  P.forEach(p => {
    if(p.b.length >= len){
      const key = p.b.slice(-len);
      if(!suffixMaps[len][key]) suffixMaps[len][key] = [];
      suffixMaps[len][key].push(p);
    }
  });
}

function beep(freq=1200, duration=150, vol=0.5){
  try{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value=freq;
    gain.gain.value=vol;
    osc.start();
    osc.stop(audioCtx.currentTime+duration/1000);
  }catch(e){}
}

// ===== CAMERA =====
let torchOn = false;
let currentTrack = null;
let nativeScanInterval = null;
let videoStream = null;
const NATIVE_FORMATS = ['ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','code_93'];
const hasNativeDetector = ('BarcodeDetector' in window);

async function startCamera(){
  if(cameraActive) return;
  const readerEl = document.getElementById("reader");
  readerEl.innerHTML = "";

  if(hasNativeDetector){
    // === NATIVE BarcodeDetector — much faster & more reliable ===
    try {
      const supported = await BarcodeDetector.getSupportedFormats();
      const formats = NATIVE_FORMATS.filter(f => supported.includes(f));
      if(formats.length === 0) { startCameraFallback(); return; }

      const detector = new BarcodeDetector({formats});

      // Create video element
      const video = document.createElement("video");
      video.setAttribute("playsinline","true");
      video.setAttribute("autoplay","true");
      video.setAttribute("muted","true");
      video.style.cssText = "width:100%;border-radius:12px;object-fit:cover;max-height:300px;display:block;";
      readerEl.appendChild(video);

      // Request HD camera with autofocus
      const constraints = {
        video: {
          facingMode: "environment",
          width: {ideal:1920, min:1280},
          height: {ideal:1080, min:720},
        }
      };

      videoStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = videoStream;
      await video.play();

      // Set up torch, focus & zoom
      currentTrack = videoStream.getVideoTracks()[0];
      try {
        const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
        if(caps.torch) document.getElementById("torchBtn").style.display="flex";
        const advConstraints = [];
        if(caps.focusMode && caps.focusMode.includes("continuous")){
          advConstraints.push({focusMode:"continuous"});
        }
        // Apply 1.5x zoom for closer barcode reading
        if(caps.zoom && caps.zoom.max > 1){
          const targetZoom = Math.min(1.5, caps.zoom.max);
          advConstraints.push({zoom: targetZoom});
        }
        if(advConstraints.length > 0){
          await currentTrack.applyConstraints({advanced: advConstraints}).catch(()=>{});
        }
      }catch(e){}

      // Create canvas for center-crop detection (improves accuracy)
      const cropCanvas = document.createElement("canvas");
      const cropCtx = cropCanvas.getContext("2d");

      // Scan loop — 20 times per second, with center-crop
      let scanning = false;
      nativeScanInterval = setInterval(async ()=>{
        if(video.readyState < 2 || scanning) return;
        scanning = true;
        try {
          // First try full frame
          let barcodes = await detector.detect(video);

          // If no result, try center-cropped frame (better for small barcodes)
          if(barcodes.length === 0){
            const vw = video.videoWidth, vh = video.videoHeight;
            if(vw > 0 && vh > 0){
              const cw = Math.round(vw * 0.7);
              const ch = Math.round(vh * 0.5);
              cropCanvas.width = cw;
              cropCanvas.height = ch;
              cropCtx.drawImage(video, (vw-cw)/2, (vh-ch)/2, cw, ch, 0, 0, cw, ch);
              barcodes = await detector.detect(cropCanvas);
            }
          }

          for(const bc of barcodes){
            if(bc.rawValue){
              onScanSuccess(bc.rawValue);
              break;
            }
          }
        }catch(e){}
        scanning = false;
      }, 50);

      cameraActive = true;
      document.getElementById("camStartBtn").style.display="none";
      document.getElementById("camStopBtn").style.display="block";
      document.getElementById("scanHint").style.display="block";
      console.log("Native BarcodeDetector active, formats:", formats.join(","));

    } catch(err) {
      console.error("Native scanner error:", err);
      startCameraFallback();
    }
  } else {
    startCameraFallback();
  }
}

function startCameraFallback(){
  // === Fallback: html5-qrcode library ===
  const readerEl = document.getElementById("reader");
  readerEl.innerHTML = "";

  const screenW = Math.min(window.innerWidth - 40, 600);
  const qrW = Math.round(screenW * 0.85);
  const qrH = Math.round(qrW * 0.35);

  const formatsToSupport = [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.ITF,
    Html5QrcodeSupportedFormats.CODE_93,
  ];

  scanner = new Html5Qrcode("reader", {formatsToSupport, verbose:false});

  scanner.start(
    {facingMode:"environment"},
    {fps:25, qrbox:{width:qrW,height:qrH}, disableFlip:true,
     experimentalFeatures:{useBarCodeDetectorIfSupported:false}},
    onScanSuccess, ()=>{}
  ).then(()=>{
    cameraActive = true;
    document.getElementById("camStartBtn").style.display="none";
    document.getElementById("camStopBtn").style.display="block";
    document.getElementById("scanHint").style.display="block";

    try {
      const videoEl = document.querySelector("#reader video");
      if(videoEl && videoEl.srcObject){
        currentTrack = videoEl.srcObject.getVideoTracks()[0];
        const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
        if(caps.torch) document.getElementById("torchBtn").style.display="flex";
        if(caps.focusMode && caps.focusMode.includes("continuous")){
          currentTrack.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{});
        }
      }
    }catch(e){}
    console.log("Fallback html5-qrcode scanner active");
  }).catch(err=>{
    console.error("Camera fallback error:",err);
    showToast("❌ לא ניתן לפתוח מצלמה");
  });
}

function toggleTorch(){
  if(!currentTrack) return;
  torchOn = !torchOn;
  currentTrack.applyConstraints({advanced:[{torch:torchOn}]}).then(()=>{
    document.getElementById("torchBtn").classList.toggle("active",torchOn);
  }).catch(()=>{torchOn=false;});
}

function stopCamera(){
  // Stop native scanner
  if(nativeScanInterval){
    clearInterval(nativeScanInterval);
    nativeScanInterval = null;
  }
  if(videoStream){
    videoStream.getTracks().forEach(t => t.stop());
    videoStream = null;
  }
  // Stop html5-qrcode scanner
  if(scanner && cameraActive){
    scanner.stop().catch(()=>{});
  }
  torchOn = false;
  currentTrack = null;
  cameraActive = false;
  document.getElementById("camStartBtn").style.display="block";
  document.getElementById("camStopBtn").style.display="none";
  document.getElementById("torchBtn").style.display="none";
  document.getElementById("scanHint").style.display="none";
  document.getElementById("reader").innerHTML="";
}


let lastScanTime = 0;
function onScanSuccess(code){
  // Debounce: ignore same scan within 2 seconds
  const now = Date.now();
  if(now - lastScanTime < 2000) return;
  lastScanTime = now;

  // Audio + vibrate feedback
  if(audioCtx.state==="suspended") audioCtx.resume();
  beep();
  try{navigator.vibrate(100);}catch(e){}

  // Lookup
  const product = productMap[code];
  if(product){
    showProductCard(product);
  } else {
    // Try suffix
    for(let len = code.length; len >= 4; len--){
      if(suffixMaps[len]){
        const matches = suffixMaps[len][code.slice(-len)];
        if(matches && matches.length === 1){showProductCard(matches[0]);return;}
        if(matches && matches.length > 1){showMultipleMatches(matches);return;}
      }
    }
    showNotFound(code);
  }
}

// ===== BARCODE INPUT =====
const barcodeInput = document.getElementById("barcodeInput");
document.getElementById("searchBtn").addEventListener("click", lookupBarcode);
barcodeInput.addEventListener("keydown", e=>{if(e.key==="Enter")lookupBarcode();});

function lookupBarcode(){
  const code = barcodeInput.value.trim();
  if(!code) return;

  // Exact match
  if(productMap[code]){showProductCard(productMap[code]);return;}

  const len = code.length;
  // Under 4 digits: exact only
  if(len < 4){showNotFound(code);return;}

  // Suffix match
  if(len <= maxBarcodeLen && suffixMaps[len]){
    const matches = suffixMaps[len][code];
    if(matches && matches.length === 1){showProductCard(matches[0]);return;}
    if(matches && matches.length > 1){showMultipleMatches(matches);return;}
  }
  showNotFound(code);
}

// ===== PRODUCT CARD =====
const productCard = document.getElementById("productCard");

function getCountsForBarcode(b){return countEntries.filter(e=>e.barcode===b);}
function getTotalForBarcode(b){return getCountsForBarcode(b).reduce((s,e)=>s+e.qty,0);}

function showProductCard(p){
  const prevCounts = getCountsForBarcode(p.b);
  const prevTotal = prevCounts.reduce((s,e)=>s+e.qty,0);
  const showCostEdit = p.c === 0;

  productCard.hidden = false;
  productCard.innerHTML = `
    <div class="product-card">
      <h3>${esc(p.n)}</h3>
      <div class="product-meta">
        <div>ברקוד: <span style="direction:ltr;display:inline-block">${esc(p.b)}</span></div>
        <div>ספק: <span>${esc(p.s||"—")}</span></div>
        <div>עלות: <span>₪${p.c.toFixed(2)}</span></div>
        <div>מכירה: <span>₪${p.p.toFixed(2)}</span></div>
      </div>
      ${prevTotal>0?`<div style="background:var(--success-light);color:var(--success);padding:7px 10px;border-radius:8px;margin-bottom:8px;font-size:0.8rem;font-weight:600;">🔒 נספר: ${prevTotal} יח' (${prevCounts.length} ספירות) — שורה חדשה</div>`:""}
      ${showCostEdit?`
        <div class="cost-row">
          <label>⚠️ עלות:</label>
          <input type="number" class="cost-input" id="costInput" value="0" step="0.01" inputmode="decimal">
          <span class="cost-zero-alert">עלות 0!</span>
        </div>
      `:`
        <div class="cost-row" style="background:var(--surface);border:1px solid var(--border);" hidden id="costEditRow">
          <label>עלות:</label>
          <input type="number" class="cost-input" id="costInput" value="${p.c}" step="0.01" inputmode="decimal">
        </div>
        <div style="margin-bottom:8px;">
          <button style="background:none;border:none;color:var(--accent);font-family:inherit;font-size:0.78rem;cursor:pointer;padding:0;" onclick="document.getElementById('costEditRow').hidden=!document.getElementById('costEditRow').hidden;">✏️ שנה עלות</button>
        </div>
      `}
      <div class="qty-row">
        <input type="number" class="qty-input" id="qtyInput" min="1" value="" placeholder="0" inputmode="numeric">
        <button class="confirm-btn" onclick="confirmCount('${p.b}')">✓ אישור</button>
        <button class="cancel-btn" onclick="cancelCard()">ביטול</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    if(showCostEdit) document.getElementById("costInput").focus();
    else document.getElementById("qtyInput").focus();
  },100);
}

function showMultipleMatches(matches){
  productCard.hidden = false;
  const list = matches.slice(0,10);
  productCard.innerHTML = `
    <div class="product-card" style="border-color:var(--warn);">
      <h3>נמצאו ${matches.length} תוצאות</h3>
      ${list.map(p=>`
        <div class="search-item" onclick="selectProduct('${p.b}')">
          <div class="item-name">${esc(p.n)}</div>
          <div class="item-barcode">${esc(p.b)} · ₪${p.p.toFixed(2)}</div>
        </div>
      `).join("")}
      <button class="cancel-btn" style="margin-top:8px;width:100%" onclick="cancelCard()">סגור</button>
    </div>
  `;
}

function selectProduct(barcode){
  const p = productMap[barcode];
  if(p) showProductCard(p);
}

function showNotFound(code){
  productCard.hidden = false;
  productCard.innerHTML = `
    <div class="product-card" style="border-color:var(--danger);">
      <h3>❌ לא נמצא</h3>
      <p style="color:var(--fg-dim);font-size:0.85rem;">קוד ${esc(code)} לא קיים ברשימה</p>
      <button class="cancel-btn" style="margin-top:8px;width:100%" onclick="cancelCard()">סגור</button>
    </div>
  `;
}

function cancelCard(){
  productCard.hidden = true;
  barcodeInput.value = "";
  barcodeInput.focus();
}

function confirmCount(barcode){
  const qty = parseInt(document.getElementById("qtyInput").value)||0;
  if(qty<=0){document.getElementById("qtyInput").style.borderColor="var(--danger)";return;}
  const p = productMap[barcode];
  if(!p) return;

  const costEl = document.getElementById("costInput");
  const editedCost = costEl ? parseFloat(costEl.value) : p.c;

  const entry = {
    id: Date.now()+"_"+Math.random().toString(36).slice(2,6),
    barcode: p.b,
    name: p.n,
    cost: editedCost||p.c,
    costEdited: costEl ? editedCost!==p.c : false,
    price: p.p,
    supplier: p.s,
    qty: qty,
    ts: new Date().toISOString(),
    device: settings.deviceName
  };

  countEntries.push(entry);
  pendingSync++;
  document.getElementById("pendingBadge").textContent = pendingSync;
  saveCounts();

  // Auto-transmit
  if(settings.gasUrl && pendingSync >= settings.autoSync){
    transmit();
  }

  productCard.hidden = true;
  barcodeInput.value = "";
  barcodeInput.focus();
  showToast(`🔒 ${p.n} — ${qty} יח'`);
  renderCounted();
  renderSummary();
}

// ===== TABS =====
document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const t=tab.dataset.tab;
    document.getElementById("countedTab").hidden=t!=="counted";
    document.getElementById("summaryTab").hidden=t!=="summary";
    document.getElementById("searchTab").hidden=t!=="search";
  });
});

// ===== RENDER =====
function renderCounted(){
  const countedList = document.getElementById("countedList");
  const uniqueBarcodes = new Set(countEntries.map(e=>e.barcode));
  document.getElementById("countBadge").textContent = uniqueBarcodes.size;

  if(countEntries.length===0){
    countedList.innerHTML=`<div class="empty-state"><div class="icon">📦</div><p>עדיין לא נספרו מוצרים<br>סרקו ברקוד כדי להתחיל</p></div>`;
    return;
  }

  const grouped={};const order=[];
  countEntries.forEach(e=>{
    if(!grouped[e.barcode]){grouped[e.barcode]=[];order.push(e.barcode);}
    grouped[e.barcode].push(e);
  });
  order.reverse();
  const seen=new Set();
  const unique=order.filter(b=>{if(seen.has(b))return false;seen.add(b);return true;});

  countedList.innerHTML=unique.map(barcode=>{
    const entries=grouped[barcode];
    const total=entries.reduce((s,e)=>s+e.qty,0);
    const last=entries[entries.length-1];
    const breakdown=entries.map(e=>e.qty).join("+");
    const showBreakdown=entries.length>1;
    return`
    <div class="counted-item">
      <span class="lock-icon">🔒</span>
      <div class="item-info">
        <div class="item-name">${esc(last.name)}</div>
        <div class="item-barcode">${esc(last.barcode)}</div>
        ${showBreakdown?`<div class="item-counts-detail">${breakdown} = ${total}</div>`:""}
      </div>
      <div>
        <div class="item-qty-badge">${total}</div>
        <div class="item-locked-label">נספר ✓</div>
      </div>
    </div>`;
  }).join("");
}

function renderSummary(){
  const summaryList=document.getElementById("summaryList");
  const grouped={};
  countEntries.forEach(e=>{
    if(!grouped[e.barcode])grouped[e.barcode]={name:e.name,barcode:e.barcode,cost:e.cost,price:e.price,supplier:e.supplier,counts:[]};
    grouped[e.barcode].counts.push(e);
    if(e.costEdited)grouped[e.barcode].cost=e.cost;
  });

  const items=Object.values(grouped);
  if(items.length===0){
    summaryList.innerHTML=`<div class="empty-state"><div class="icon">📊</div><p>הסיכום יופיע כאן</p></div>`;
    return;
  }
  summaryList.innerHTML=items.map(g=>{
    const total=g.counts.reduce((s,c)=>s+c.qty,0);
    const breakdown=g.counts.map(c=>c.qty).join("+");
    const devices=[...new Set(g.counts.map(c=>c.device))];
    return`
    <div class="summary-item">
      <div class="item-info">
        <div class="item-name">${esc(g.name)}</div>
        <div class="item-barcode">${esc(g.barcode)} · ₪${g.cost.toFixed(2)} · ${esc(g.supplier||"—")}</div>
        ${g.counts.length>1?`<div class="summary-breakdown">${breakdown} = ${total} ${devices.length>1?"("+devices.join(", ")+")":""}</div>`:""}
      </div>
      <div class="summary-total">${total}</div>
    </div>`;
  }).join("");
}

// ===== NAME SEARCH =====
document.getElementById("nameSearch").addEventListener("input",function(){
  const q=this.value.trim();
  const sr=document.getElementById("searchResults");
  if(q.length<2){sr.innerHTML="";return;}
  const matches=P.filter(p=>p.n.includes(q)).slice(0,15);
  if(matches.length===0){sr.innerHTML=`<p style="color:var(--fg-dim);padding:10px 0;">לא נמצאו תוצאות</p>`;return;}
  sr.innerHTML=matches.map(p=>{
    const total=getTotalForBarcode(p.b);
    return`
    <div class="search-item" onclick="selectProduct('${p.b}')">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="item-name">${esc(p.n)}</div>
          <div class="item-barcode">${esc(p.b)} · ₪${p.p.toFixed(2)}</div>
        </div>
        ${total>0?`<span style="font-size:0.72rem;color:var(--success);font-weight:600;">נספר: ${total}</span>`:""}
      </div>
    </div>`;
  }).join("");
});

// ===== TRANSMIT =====
document.getElementById("transmitBtn").addEventListener("click",transmit);
async function transmit(){
  if(pendingSync===0){showToast("אין פריטים חדשים");return;}
  if(!settings.gasUrl){showToast("⚠️ הגדר כתובת Google Script בהגדרות");return;}

  const toSend=countEntries.slice(-pendingSync);
  try{
    const payload=JSON.stringify({action:"add",device:settings.deviceName,entries:toSend});
    const url=settings.gasUrl+"?data="+encodeURIComponent(payload);
    const resp=await fetch(url,{redirect:"follow"});
    const result=await resp.json();
    if(result.success){
      pendingSync=0;
      document.getElementById("pendingBadge").textContent="0";
      saveCounts();
      showToast(`📡 שודרו ${toSend.length} פריטים (${result.added||""})`);
    } else {
      showToast("❌ שגיאה: "+(result.error||"unknown"));
    }
  }catch(e){
    showToast("❌ אין חיבור לשרת: "+e.message);
  }
}

// ===== EXPORT =====
document.getElementById("exportBtn").addEventListener("click",()=>{
  if(countEntries.length===0){showToast("אין נתונים");return;}

  const grouped={};
  countEntries.forEach(e=>{
    if(!grouped[e.barcode])grouped[e.barcode]={...e,qty:0};
    grouped[e.barcode].qty+=e.qty;
    if(e.costEdited)grouped[e.barcode].cost=e.cost;
  });

  const BOM="﻿";
  let csv=BOM+"ברקוד,מוצר,מחיר עלות,מחיר מכירה,ספק,כמות\n";
  Object.values(grouped).forEach(i=>{
    csv+=`"${i.barcode}","${i.name}",${i.cost},${i.price},"${i.supplier||""}",${i.qty}\n`;
  });

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="inventory_count_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("📥 הקובץ הורד");
});

// ===== SETTINGS =====
document.getElementById("settingsBtn").addEventListener("click",()=>{
  document.getElementById("settingsModal").hidden=false;
  document.getElementById("deviceNameInput").value=settings.deviceName;
  document.getElementById("gasUrlInput").value=settings.gasUrl;
  document.getElementById("autoSyncInput").value=settings.autoSync;
});
function closeSettings(){document.getElementById("settingsModal").hidden=true;}
function saveSettings(){
  settings.deviceName=document.getElementById("deviceNameInput").value.trim()||"מכשיר 1";
  settings.gasUrl=document.getElementById("gasUrlInput").value.trim();
  settings.autoSync=parseInt(document.getElementById("autoSyncInput").value)||20;
  try{localStorage.setItem("inv_settings",JSON.stringify(settings));}catch(e){}
  closeSettings();
  showToast("✓ הגדרות נשמרו");
}

// ===== UTILS =====
function showToast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const toast=document.createElement("div");
  toast.className="toast";toast.textContent=msg;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),2000);
}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
</script>
